<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Dayling</title>
    <style>
      :root {
        color: #3a2e2e;
        background: #fff8f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        display: grid;
        max-width: 360px;
        gap: 12px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #8f7d7d;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dayling</h1>
      <p>Next.js 서버 주소를 WebView로 연결해 실행하는 앱입니다.</p>
    </main>
  </body>
</html>
